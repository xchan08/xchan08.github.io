name: sync-sheet
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUB: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSoX9uKM797qISmK5m-5KHJkV9bWB8J7Bq9SaDNHC6qlt-FbpRb0E6O4MGgdHVGrhrbOUw82gLnMudf/pub"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published CSVs (one per tab)
        run: |
          mkdir -p data
          fetch() { curl -fsSL "$PUB?gid=$2&single=true&output=csv" -o "data/$1.csv"; }
          fetch Profile      0
          fetch Stats        1962668757
          fetch Skills       366870875
          fetch Experience   1068223889
          fetch Achievements 4584789
          wc -l data/*.csv
      - name: Commit if changed
        run: |
          git config user.name  "sheet-sync-bot"
          git config user.email "sheet-sync-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No sheet changes since last sync."
            exit 0
          fi
          git commit -m "chore: sync bio data from sheet"
          git push
